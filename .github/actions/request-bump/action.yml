name: Request deployment bump
description: >
  Mints a short-lived, scoped token for the deploy-dispatch GitHub App and asks
  cluster-config to bump this app's image digest. cluster-config verifies the
  image's provenance itself before acting.

inputs:
  client-id:
    description: Client ID for the deploy-dispatch GitHub App.
    required: true
  private-key:
    description: Private key for the deploy-dispatch GitHub App.
    required: true
  digest:
    description: "Image digest to deploy, sha256:<64 hex>."
    required: true

runs:
  using: composite
  steps:
    - name: Mint dispatch token for cluster-config
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: dispatch-token
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: cluster-config
        permission-actions: write

    - name: Trigger bump in cluster-config
      shell: bash
      env:
        GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        OWNER: ${{ github.repository_owner }}
        DIGEST: ${{ inputs.digest }}
      run: |
        set -euo pipefail

        APP="${GITHUB_REPOSITORY#*/}"

        gh workflow run bump-image.yml \
          --repo "${OWNER}/cluster-config" \
          --ref main \
          -f app="$APP" \
          -f digest="$DIGEST" \
          -f source-digest="$GITHUB_SHA"

        echo "Requested bump of ${APP} to ${DIGEST} in ${OWNER}/cluster-config."
        echo "cluster-config verifies provenance itself before acting."
