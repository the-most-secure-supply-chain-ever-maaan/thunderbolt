name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml

  build-image:
    name: Build Image
    needs: build-and-test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      artifact-metadata: write
    uses: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/build.yaml@e2e761f7dc238f0e793114edfc8dd34d6f7e535a # v1.10.0
    secrets: inherit
