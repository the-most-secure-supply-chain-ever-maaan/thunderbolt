name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  artifact-metadata: write

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml

  build-image:
    name: Build Image
    needs: build-and-test
    uses: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/build.yaml@ccf930b396b6f3dd8267d68e7ad58531059b5bc7 # v1.0.0

  verify-and-update-digest:
    name: Verify Provenance and Update Deployment
    needs: build-image
    if: github.event_name == 'push'
    uses: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/verify-and-bump-deployment.yaml@6f0a5f6239ecd95e049958e5b9a0850df2491c54 # harden-verify-and-bump-trust-anchors, pending v1.1.0 tag
    with:
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.build-image.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-token: ${{ secrets.GITHUB_TOKEN }}
      deploy-repo-token: ${{ secrets.CLUSTER_CONFIG_TOKEN }}
