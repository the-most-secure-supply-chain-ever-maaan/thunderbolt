name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  artifact-metadata: write

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml

  build-image:
    name: Build Image
    needs: build-and-test
    uses: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/build.yaml@09bf0d315cc8ef164a4222eb216669fbfb2729fb # v1.8.0
    secrets:
      BUMP_CLUSTER_CONFIG_KEY: ${{ secrets.BUMP_CLUSTER_CONFIG_KEY }}
