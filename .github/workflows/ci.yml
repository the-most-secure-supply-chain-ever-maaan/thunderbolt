name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify-packages:
    name: Verify packages
    permissions:
      contents: read
      packages: read
      attestations: read
    uses: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/verify-packages.yml@77a2eb5de888b42c6afda2b48961a818df179be1 # v1.16.0

  build-and-test:
    name: Build and Test
    needs: verify-packages
    uses: ./.github/workflows/build-and-test.yml

  build-image:
    name: Build Image
    needs: build-and-test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      artifact-metadata: write
    uses: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/build.yaml@eb8ecdc730cafb5d7bc67e193f4e78193d431ee7 # v1.12.0

  request-deployment-bump:
    name: Request Deployment Bump
    needs: build-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/request-bump
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_CLUSTER_CONFIG_KEY }}
          digest: ${{ needs.build-image.outputs.digest }}
