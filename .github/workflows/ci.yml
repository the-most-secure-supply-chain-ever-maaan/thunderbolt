name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  artifact-metadata: write

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml

  build-image:
    name: Build Image
    needs: build-and-test
    uses: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/build.yaml@c15f902df5df381a1cfef8805b641aa4e4cb392b # v1.2.0

  verify-and-update-digest:
    name: Verify Provenance and Update Deployment
    needs: build-image
    if: github.event_name == 'push'
    uses: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/verify-and-bump-deployment.yaml@9e645770cc8b8f66b23c9730c9499c3f34a50be9 # v1.2.1
    with:
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.build-image.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-token: ${{ secrets.GITHUB_TOKEN }}
      deploy-repo-token: ${{ secrets.CLUSTER_CONFIG_TOKEN }}
