name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml

  build-image:
    name: Build Image
    needs: build-and-test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      artifact-metadata: write
    # MERK: oppdater til SHA-en build.yaml faktisk far pa main etter merge,
    # og til taggen som settes der. Uten denne oppdateringen kaller vi en
    # build.yaml som fortsatt har sin egen bump-jobb, og da bumpes det to ganger.
    uses: the-most-secure-supply-chain-ever-maaan/workflows/.github/workflows/build.yaml@REPLACE_ME # vX.Y.Z

  request-deployment-bump:
    name: Request Deployment Bump
    needs: build-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      contents: read
    steps:
      # Lokal action krever at repoet er sjekket ut forst.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/request-bump
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_CLUSTER_CONFIG_KEY }}
          digest: ${{ needs.build-image.outputs.digest }}
