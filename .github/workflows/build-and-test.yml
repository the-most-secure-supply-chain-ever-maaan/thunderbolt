name: Build and Test
on:
  workflow_call:

permissions:
  contents: read

jobs:
  run-tests-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: ".nvmrc"

      - name: Check .nvmrc matches Dockerfile
        run: |
          DOCKERFILE_MAJOR=$(grep -oP '(?<=FROM node:)\d+' Dockerfile | head -1)
          NVMRC_MAJOR=$(cut -d. -f1 <<< "${{ steps.setup-node.outputs.node-version }}")

          if [ "$DOCKERFILE_MAJOR" != "$NVMRC_MAJOR" ]; then
            echo "::error file=.nvmrc::Node major version mismatch: Dockerfile uses node:$DOCKERFILE_MAJOR, .nvmrc resolves to $NVMRC_MAJOR"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build

  # build-image:
