name: Build and Test
on:
  workflow_call:

permissions:
  contents: read

jobs:
  run-tests-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Require digest-pinned base images
        run: |
          UNPINNED_VERSIONS=$(grep -E '^FROM ' Dockerfile | grep -vE '@sha256:[0-9a-f]{64}([[:space:]]|$)')
          if [ -n "$UNPINNED_VERSIONS" ]; then
            echo "Upinnede/ugyldige FROM-linjer:"
            echo "$UNPINNED_VERSIONS"
            exit 1
          fi

      - name: Forbid non-exact version ranges in package.json
        run: '! grep -qE "\"\\s*:\\s*\"[\^~]" package.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        id: build
        run: npm run build
