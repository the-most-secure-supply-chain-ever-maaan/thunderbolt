# En ArgoCD Application forteller ArgoCD hvilken mappe i hvilket repo den
# skal følge med på. Den sier ingenting om selve appen — det står i
# manifestene den peker på.
#
# Denne applyes ÉN gang manuelt (kubectl apply -f). Etter det lever den i
# clusteret, ikke som en fil noe sted. Alt videre går via git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thunderbolt # navnet i ArgoCD-UI-et og i kubectl get applications
  namespace: argocd # Application-ressurser MÅ ligge i argocd-namespacet

spec:
  project:
    default # ArgoCD-prosjekt; brukes til å avgrense tilgang
    # når man har mange team. default holder her.

  # HVOR ArgoCD skal lete
  source:
    repoURL: https://github.com/the-most-secure-supply-chain-ever-maaan/cluster-config
    targetRevision:
      main # hvilken branch. Må matche default branch i repoet,
      # ellers får du "unable to resolve 'main' to a commit SHA"
    path: apps/thunderbolt # mappa i repoet. ArgoCD applyer ALT som ligger her.

  # HVOR det skal deployes
  destination:
    server:
      https://kubernetes.default.svc # "dette clusteret" — intern adresse
      # til API-serveren. Endres bare hvis
      # ArgoCD styrer flere clustere.
    namespace: default # namespacet ressursene havner i

  syncPolicy:
    automated:
      prune:
        true # sletter ressurser som fjernes fra git.
        # Uten denne blir gamle ressurser liggende igjen.
      selfHeal:
        true # reverserer manuelle endringer i clusteret.
        # kubectl edit blir overskrevet innen minutter —
        # det er meningen: git er fasit.
